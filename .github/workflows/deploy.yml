name: Backend CI & cPanel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run syntax & smoke tests
        run: |
          npm run check
          npm test

  # Run manually from GitHub Actions ("Run workflow") once cPanel SSH secrets are added,
  # or add `branches: [main]` automation after SERVER_HOST / SERVER_USER are configured.
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Package backend release
        run: tar -czf release.tar.gz server.js package.json package-lock.json src sql scripts

      - name: Upload release to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "release.tar.gz"
          target: "/home/${{ secrets.SERVER_USER }}/api.hmyvalibhoycc-dhari.com/"
          overwrite: true

      - name: Extract and restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/api.hmyvalibhoycc-dhari.com/
            tar -xzf release.tar.gz
            rm -f release.tar.gz
            npm ci --omit=dev || npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment complete for api.hmyvalibhoycc-dhari.com"
