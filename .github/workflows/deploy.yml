name: Backend CI & cPanel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run syntax & smoke tests
        run: |
          npm run check
          npm test

  # Automatically deploys to cPanel on every push to main when SERVER_PASSWORD secret is configured
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to cPanel via SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no -p 22 hmyvalib@s670.bom1.mysecurecloudhost.com "/home/hmyvalib/deploy-api.sh"


